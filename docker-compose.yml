services:
  db-pgvector:
    image: ankane/pgvector:latest
    container_name: postgres-pgvector-p13
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: puls_events_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgvector_data_p13:/var/lib/postgresql/data

volumes:
  pgvector_data_p13:
